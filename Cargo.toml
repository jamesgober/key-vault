[package]
name = "key-vault"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "In-memory key vault for Rust: page-locked (mlock / VirtualLock), zero-on-drop key storage with opaque handles, atomic rotation, scoped access, fragmentation and codex obfuscation, failure monitoring and audit hooks. Pluggable key fetchers (keychain, file, env)."

# 5-slot search optimization: vault, keys, encryption, secure, keychain
keywords = [
    "vault",
    "keys",
    "encryption",
    "secure",
    "keychain"
]

# 5 categories for discoverability
categories = [
    "cryptography",
    "authentication",
    "memory-management",
    "os",
    "api-bindings"
]

documentation = "https://docs.rs/key-vault"
repository    = "https://github.com/jamesgober/key-vault"
homepage      = "https://github.com/jamesgober/key-vault"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "key_vault"
path = "src/lib.rs"

[features]
# Feature status in 1.1
# ---------------------
# `std` (default) builds the full crate. Without it the crate is
# `no_std` + `alloc`; see README "no_std" for what that needs.
#
# The `fragment-*`, `decoy-*`, `codex*`, `monitor`, `audit` and `preset-*`
# features choose what `KeyVaultBuilder::from_features()` configures.
# They never change what `KeyVaultBuilder::new()` does, so turning one on
# does not change existing vaults. `mlock`, `zeroize`, `tee-detect` and
# `post-quantum` are deprecated no-ops (page locking and zeroization
# cannot be turned off). See docs/API.md "Cargo features".
default = ["std", "mlock", "zeroize", "fragment-standard", "decoy-self-ref"]

# Core
std = ["dep:arc-swap", "blake3/std", "subtle/std"]  # Standard library (default on)
mlock = []                            # Deprecated no-op: page locking is always on
zeroize = []                          # Deprecated no-op: zero-on-drop is always on

# Key fetchers (pluggable sources). All require `std`.
fetcher-keychain = [
    "std",
    "dep:keyring",
    "keyring/apple-native",
    "keyring/windows-native",
    "keyring/async-secret-service",
    "keyring/async-io",
    "keyring/crypto-rust",
]                                     # OS keychain (macOS, Windows, Linux Secret Service)
fetcher-file = ["std"]                # Plaintext key file (no decryption; use disk encryption)
fetcher-env = ["std"]                 # Environment variable
fetcher-tpm = ["std"]                 # TpmFetch type only: not implemented, fetch() always errors
fetcher-all = ["fetcher-keychain", "fetcher-file", "fetcher-env"]

# Fragment strategy chosen by KeyVaultBuilder::from_features(). When
# several are on, the first of layered, random, interleaved, standard wins.
fragment-standard = []                # StandardFragmenter (variable chunks + shuffle)
fragment-interleaved = []             # InterleavedFragmenter (bytes scattered in a padded pool)
fragment-random = []                  # RandomFragmenter (non-contiguous byte groups)
fragment-layered = []                 # LayeredFragmenter over standard, interleaved and random
fragment-all = ["fragment-standard", "fragment-interleaved", "fragment-random", "fragment-layered"]

# Decoy chosen by from_features() for the standard fragmenter. When several
# are on, the strongest wins: self-ref, then key-derived, then random.
decoy-random = []                     # RandomDecoy (weakest, fastest)
decoy-self-ref = []                   # SelfReferenceDecoy (strongest)
decoy-key-derived = []                # KeyDerivedDecoy (BLAKE3 XOF of key + nonce)
decoy-all = ["decoy-random", "decoy-self-ref", "decoy-key-derived"]

# Codex used by from_features(): a fresh DynamicCodex per vault.
codex = []
codex-dynamic = ["codex"]

# Monitoring and audit. With monitor-tracing, from_features() attaches
# LogMonitor (`monitor`) and LogAudit (`audit`).
monitor = []
monitor-tracing = ["monitor", "std", "dep:tracing"]  # LogMonitor / LogAudit via `tracing`
audit = []

tee-detect = []                       # Deprecated no-op: TEE detection is always compiled with std
post-quantum = []                     # Deprecated no-op: informational only

# Presets for from_features(). Page locking and zeroization stay on in
# every preset.
preset-balanced = ["std", "mlock", "zeroize", "fragment-standard", "decoy-self-ref"]
preset-paranoid = ["std", "mlock", "zeroize", "fragment-layered", "decoy-all", "codex", "monitor", "audit", "tee-detect"]
preset-fast = ["std", "fragment-standard", "decoy-random"]

[dependencies]
# Constant-time comparisons (security-critical)
subtle = { version = "2.5", default-features = false }

# Lock-free read access to vault state (std builds; no_std uses a spin lock)
arc-swap = { version = "1.7", optional = true }

# Cryptographically secure RNG. `custom` only takes effect on targets
# getrandom has no backend for (bare metal): there the application must
# register an RNG with `key_vault::register_rng!`, or linking fails.
getrandom = { version = "0.2", features = ["custom"] }

# Cryptographic hashing for key normalization. The `zeroize` feature lets
# the vault wipe hasher state and digests that are derived from key bytes.
blake3 = { version = "1.5", default-features = false, features = ["zeroize"] }

# Wiping of secret-bearing buffers (always on).
zeroize = { version = "1.7", features = ["derive"] }

# Optional - OS keychain integration
keyring = { version = "3", optional = true }

# Optional - tracing integration for monitor
tracing = { version = "0.1", optional = true }

# Unix syscall surface: mlock, madvise, mmap and mprotect.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

# Windows syscall surface: VirtualLock / VirtualProtect / VirtualAlloc,
# GetSystemInfo for the page size, GetProcAddress for the WER exclusion
# API (looked up at run time).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# Heap profiler used by the dhat_hot_path example to verify the
# zero-allocation hot-path claim in docs/PERFORMANCE.md. Only pulled
# in when the example is built (cargo treats examples as a separate
# compile target).
dhat = "0.3"

[[example]]
name = "dhat_hot_path"
required-features = []

[[bench]]
name = "access_latency"
harness = false

[[bench]]
name = "concurrent_access"
harness = false

[[bench]]
name = "fragment_strategies"
harness = false

[[bench]]
name = "decoy_strategies"
harness = false

[[bench]]
name = "codex_overhead"
harness = false

[[bench]]
name = "memory_overhead"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
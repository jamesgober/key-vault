[package]
name = "key-vault"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "In-memory key vault for Rust: page-locked (mlock / VirtualLock), zero-on-drop key storage with opaque handles, atomic rotation, scoped access, fragmentation and codex obfuscation, failure monitoring and audit hooks. Pluggable key fetchers (keychain, file, env)."

# 5-slot search optimization: vault, keys, encryption, secure, keychain
keywords = [
    "vault",
    "keys",
    "encryption",
    "secure",
    "keychain"
]

# 5 categories for discoverability
categories = [
    "cryptography",
    "authentication",
    "memory-management",
    "os",
    "api-bindings"
]

documentation = "https://docs.rs/key-vault"
repository    = "https://github.com/jamesgober/key-vault"
homepage      = "https://github.com/jamesgober/key-vault"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "key_vault"
path = "src/lib.rs"

[features]
# Feature status in 1.0.x
# -----------------------
# Only `std`, the `fetcher-*` features and `monitor-tracing` change what
# gets compiled. Every other feature below is RESERVED: it is accepted so
# existing feature lists keep building, but it has NO EFFECT in 1.0.x.
# Page locking and zero-on-drop are always on; the fragmenter, decoy and
# codex are chosen through `KeyVaultBuilder`, not through features. See
# docs/API.md "Cargo features" for the full table.
default = ["std", "mlock", "zeroize", "fragment-standard", "decoy-self-ref"]

# Core
std = []                              # Standard library (default on, required)
mlock = []                            # Reserved, no effect in 1.0.x (page locking is always on)
zeroize = []                          # Reserved, no effect in 1.0.x (zero-on-drop is always on)

# Key fetchers (pluggable sources)
fetcher-keychain = ["dep:keyring"]    # OS keychain (macOS, Windows, Linux) via `keyring`
fetcher-file = []                     # Plaintext key file (no decryption; use disk encryption)
fetcher-env = []                      # Environment variable
fetcher-tpm = []                      # TpmFetch type only: not implemented, fetch() always errors
fetcher-all = ["fetcher-keychain", "fetcher-file", "fetcher-env"]

# Fragment strategies: reserved, no effect in 1.0.x. All four strategy
# types are always compiled; the vault itself always uses StandardFragmenter.
fragment-standard = []                # Reserved, no effect in 1.0.x
fragment-interleaved = []             # Reserved, no effect in 1.0.x
fragment-random = []                  # Reserved, no effect in 1.0.x
fragment-layered = []                 # Reserved, no effect in 1.0.x
fragment-all = ["fragment-standard", "fragment-interleaved", "fragment-random", "fragment-layered"]

# Decoy strategies: reserved, no effect in 1.0.x. No decoy is used unless
# one is passed to KeyVaultBuilder::with_decoy.
decoy-random = []                     # Reserved, no effect in 1.0.x
decoy-self-ref = []                   # Reserved, no effect in 1.0.x
decoy-key-derived = []                # Reserved, no effect in 1.0.x
decoy-all = ["decoy-random", "decoy-self-ref", "decoy-key-derived"]

# Codex: reserved, no effect in 1.0.x. No codex is used unless one is
# passed to KeyVaultBuilder::with_codex.
codex = []                            # Reserved, no effect in 1.0.x
codex-dynamic = ["codex"]             # Reserved, no effect in 1.0.x

# Monitoring and audit: the traits and the vault hooks are always compiled.
monitor = []                          # Reserved, no effect in 1.0.x
monitor-tracing = ["monitor", "dep:tracing"]  # LogMonitor / LogAudit via the `tracing` crate
audit = []                            # Reserved, no effect in 1.0.x

# TEE detection is always compiled.
tee-detect = []                       # Reserved, no effect in 1.0.x

post-quantum = []                     # Reserved, no effect in 1.0.x

# Convenience presets. In 1.0.x they only enable the features listed, so
# `preset-paranoid` and `preset-fast` build the same code as
# `preset-balanced`. In particular `preset-fast` does not turn off page
# locking, and `preset-paranoid` does not turn on decoys or a codex.
preset-balanced = ["std", "mlock", "zeroize", "fragment-standard", "decoy-self-ref"]
preset-paranoid = ["std", "mlock", "zeroize", "fragment-layered", "decoy-all", "codex", "monitor", "audit", "tee-detect"]
preset-fast = ["std", "fragment-standard", "decoy-random"]

[dependencies]
# Constant-time comparisons (security-critical)
subtle = "2.5"

# Lock-free read access to vault state
arc-swap = "1.7"

# Cryptographically secure RNG
getrandom = "0.2"

# Cryptographic hashing for key normalization. The `zeroize` feature lets
# the vault wipe hasher state and digests that are derived from key bytes.
blake3 = { version = "1.5", features = ["zeroize"] }

# Wiping of secret-bearing buffers (always on).
zeroize = { version = "1.7", features = ["derive"] }

# Optional - OS keychain integration
keyring = { version = "3", optional = true }

# Optional - tracing integration for monitor
tracing = { version = "0.1", optional = true }

# Unix syscall surface — mlock(2) / munlock(2) for memory page locking.
# Target-gated so Windows builds don't pick this up.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows syscall surface: VirtualLock / VirtualUnlock for memory page
# locking, GetSystemInfo for the page size.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

# Heap profiler used by the dhat_hot_path example to verify the
# zero-allocation hot-path claim in docs/PERFORMANCE.md. Only pulled
# in when the example is built (cargo treats examples as a separate
# compile target).
dhat = "0.3"

[[example]]
name = "dhat_hot_path"
required-features = []

[[bench]]
name = "access_latency"
harness = false

[[bench]]
name = "concurrent_access"
harness = false

[[bench]]
name = "fragment_strategies"
harness = false

[[bench]]
name = "decoy_strategies"
harness = false

[[bench]]
name = "codex_overhead"
harness = false

[[bench]]
name = "memory_overhead"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # `no_std` + `alloc`: build the library for a bare-metal target (no OS,
  # no getrandom backend, no 64-bit atomics) and run the vault without
  # `std` on the host.
  no-std:
    name: no_std
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: thumbv7em-none-eabihf
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-std-${{ matrix.rust }}
      # `+toolchain` so the matrix toolchain (which has the target) is used
      # rather than the one pinned in rust-toolchain.toml.
      - run: cargo +${{ matrix.rust }} build --lib --no-default-features --target thumbv7em-none-eabihf
      - run: cargo +${{ matrix.rust }} clippy --lib --no-default-features --target thumbv7em-none-eabihf -- -D warnings
      - run: cargo +${{ matrix.rust }} test --no-default-features --test no_std_vault

  # Supply-chain checks. REPS §Dependency Management requires both
  # `cargo audit` (RustSec advisory database) and `cargo deny check`
  # (license / source / version policy) in CI. We use
  # `taiki-e/install-action` which installs precompiled binaries —
  # this sidesteps the compile-from-source MSRV churn that
  # `rustsec/audit-check@v2` runs into when transitive deps of
  # `cargo-audit` bump their own MSRV ahead of the runner's stable
  # toolchain.
  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: supply-chain
      - name: Install cargo-audit + cargo-deny (precompiled)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny --all-features check
